name: wild_spot
description: "WildSpot — SDG 15 Life on Land species observation app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  fl_chart: ^1.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    # ── Sora (display / headings)
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.woff2
          weight: 400
        - asset: assets/fonts/Sora-SemiBold.woff2
          weight: 600
        - asset: assets/fonts/Sora-Bold.woff2
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.woff2
          weight: 800

    # ── DM Sans (body / UI text)
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.woff2
          weight: 400
        - asset: assets/fonts/DMSans-Medium.woff2
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.woff2
          weight: 600
        - asset: assets/fonts/DMSans-Bold.woff2
          weight: 700

    # ── IBM Plex Mono (stats / monospace)
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.woff2
          weight: 400
        - asset: assets/fonts/IBMPlexMono-SemiBold.woff2
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.woff2
          weight: 700
